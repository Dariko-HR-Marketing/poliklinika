version: '3.8'

services:
  poliklinika-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: poliklinika-dashboard
    restart: always
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
